output = "architecture"

[limits]
max_code_lines = 1000

[analysis]
trusted_attributes = ["serde"]
trusted_derives = ["Deserialize", "Serialize"]

[visible_to]
xtask-source = ["xtask-core"]
xtask-workspace = ["xtask-core"]
xtask-modules = ["xtask-core"]
xtask-graph = ["xtask-core"]
xtask-layout = ["xtask-graph", "xtask-svg"]
xtask-svg = ["xtask-graph"]
