[workspace]
members = ["crates/*"]
resolver = "3"
exclude = ["viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tempfile = "3"
miniz_oxide = "0.8"
xtask-archive = { path = "crates/xtask-archive" }
xtask-source = { path = "crates/xtask-source" }
xtask-workspace = { path = "crates/xtask-workspace" }
xtask-modules = { path = "crates/xtask-modules" }
xtask-policy = { path = "crates/xtask-policy" }
xtask-layout = { path = "crates/xtask-layout" }
xtask-style = { path = "crates/xtask-style" }
xtask-diagram = { path = "crates/xtask-diagram" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.dev.package.xtask-layout]
opt-level = 3
